[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-data-pipeline"
version = "1.0.0"
description = "Production-grade data pipeline framework with dependency injection, validated REST APIs, and automated security controls."
readme = "PACKAGE_README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Engineering & Platform Security Team", email = "engineering@example.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.7",
    "jinja2>=3.1.4",
    "cryptography>=42.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.5",
    "pip-audit>=2.7.3",
    "twine>=4.0.2",
    "build>=1.0.3",
]
security = [
    "pip-audit>=2.7.3",
    "safety>=3.2.0",
    "bandit>=1.7.5",
]

[project.urls]
Homepage = "https://github.com/organization/secure-data-pipeline"
Documentation = "https://github.com/organization/secure-data-pipeline#readme"
Repository = "https://github.com/organization/secure-data-pipeline.git"
"Issue Tracker" = "https://github.com/organization/secure-data-pipeline/issues"

[project.scripts]
datapipeline = "datapipeline.api.app:main"
datapipeline-verify = "datapipeline.verify_install:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.pip-audit]
service = "pypi"
strict = true
desc = true
format = "columns"
cache-dir = ".cache/pip-audit"
timeout = 30
