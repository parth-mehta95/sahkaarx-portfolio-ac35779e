[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-package-demo"
version = "0.1.0"
description = "A reusable Python package scaffold with locked dependencies for reproducible environments"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Parth Mehta", email = "parth@example.com" }
]
dependencies = [
    "requests==2.31.0",
    "urllib3==2.2.1",
    "certifi==2024.2.2",
    "charset-normalizer==3.3.2",
    "idna==3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pip-tools>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry]
name = "python-package-demo"
version = "0.1.0"
description = "A reusable Python package scaffold with locked dependencies for reproducible environments"
authors = ["Parth Mehta <parth@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
requests = "2.31.0"
urllib3 = "2.2.1"
certifi = "2024.2.2"
charset-normalizer = "3.3.2"
idna = "3.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
